specVersion: v0.1.0
package:
    name: "base_uniswap_v3_latency_probe"
    version: v0.1.0

protobuf:
    files:
        - tycho/evm/v1/entity.proto
        - tycho/evm/v1/common.proto
        - tycho/evm/v1/utils.proto
        - uniswap.proto
    importPaths:
        - ./proto/v1
        - ../../../proto/
    excludePaths:
        - sf/ethereum
        - google

binaries:
    default:
        type: wasm/rust-v1
        file: ../target/wasm32-unknown-unknown/release/base_uniswap_v3_latency_probe.wasm

modules:
    - name: map_events
      kind: map
      initialBlock: 46344200
      inputs:
          - source: sf.ethereum.type.v2.Block
      output:
          type: proto:uniswap.v3.Events

    - name: map_balance_changes
      kind: map
      initialBlock: 46344200
      inputs:
          - map: map_events
      output:
          type: proto:tycho.evm.v1.BlockBalanceDeltas

    - name: store_pools_balances
      kind: store
      initialBlock: 46344200
      updatePolicy: add
      valueType: bigint
      inputs:
          - map: map_balance_changes

    - name: map_ticks_changes
      kind: map
      initialBlock: 46344200
      inputs:
          - map: map_events
      output:
          type: proto:uniswap.v3.TickDeltas

    - name: store_ticks_liquidity
      kind: store
      initialBlock: 46344200
      updatePolicy: add
      valueType: bigint
      inputs:
          - map: map_ticks_changes

    - name: store_pool_current_tick
      kind: store
      initialBlock: 46344200
      updatePolicy: set
      valueType: int64
      inputs:
          - map: map_events

    - name: map_liquidity_changes
      kind: map
      initialBlock: 46344200
      inputs:
          - map: map_events
          - store: store_pool_current_tick
      output:
          type: proto:uniswap.v3.LiquidityChanges

    - name: store_liquidity
      kind: store
      initialBlock: 46344200
      updatePolicy: set_sum
      valueType: bigint
      inputs:
          - map: map_liquidity_changes

    - name: map_protocol_changes
      kind: map
      initialBlock: 46344200
      inputs:
          - source: sf.ethereum.type.v2.Block
          - map: map_events
          - map: map_balance_changes
          - store: store_pools_balances
            mode: deltas
          - map: map_ticks_changes
          - store: store_ticks_liquidity
            mode: deltas
          - map: map_liquidity_changes
          - store: store_liquidity
            mode: deltas
      output:
          type: proto:tycho.evm.v1.BlockChanges
