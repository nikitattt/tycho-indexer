specVersion: v0.1.0
package:
    name: "base_uniswap_v2_with_extra"
    version: v0.1.0

imports:
    v2: ./spkg/base-uniswap-v2-v0.3.2.spkg

binaries:
    default:
        type: wasm/rust-v1
        file: ../target/wasm32-unknown-unknown/release/ethereum_uniswap_v2_with_extra.wasm

modules:
    - name: map_v2_extra_changes
      kind: map
      initialBlock: 43005492
      inputs:
          - source: sf.ethereum.type.v2.Block
          - store: v2:store_pools
      output:
          type: proto:tycho.evm.v1.BlockChanges

    - name: map_pool_events_with_extra
      kind: map
      initialBlock: 6601915
      inputs:
          - map: v2:map_pool_events
          - map: map_v2_extra_changes
      output:
          type: proto:tycho.evm.v1.BlockChanges
