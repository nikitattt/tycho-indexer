[package]
name = "ethereum-uniswap-v3-fees"
version = "0.1.0"
edition = "2021"

[lib]
name = "ethereum_uniswap_v3_fees"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.75"
arrayvec = "0.7.6"
ethabi = "18.0.0"
hex = "0.4.3"
hex-literal = "0.4.1"
itertools = "0.13.0"
num-bigint = "0.4.4"
prost = "0.11"
rustc-hash = "2.1.2"
substreams = "0.5.22"
substreams-ethereum = "0.9.9"
substreams-helper = { git = "https://github.com/propeller-heads/tycho-protocol-sdk.git", tag = "0.4.0" }
tiny-keccak = { version = "2.0", features = ["keccak"] }
tycho-substreams = { git = "https://github.com/propeller-heads/tycho-protocol-sdk.git", tag = "0.4.0" }

[dev-dependencies]
prost-types = "0.11"

[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.2", features = ["custom"] }

[build-dependencies]
anyhow = "1.0.75"
substreams-ethereum = "0.9.9"
