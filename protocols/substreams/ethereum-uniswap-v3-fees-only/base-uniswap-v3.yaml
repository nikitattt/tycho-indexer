specVersion: v0.1.0
package:
  name: "base_uniswap_v3_fees_only"
  version: v0.1.0
  url: "https://github.com/propeller-heads/tycho-indexer/tree/main/protocols/substreams/ethereum-uniswap-v3-fees-only"

protobuf:
  files:
    - tycho/evm/v1/common.proto
    - fees.proto
  importPaths:
    - ./proto/v1
    - ../../../proto/
  excludePaths:
    - sf/ethereum
    - google

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/ethereum_uniswap_v3_fees_only.wasm

modules:
  - name: map_protocol_fee_pool_candidates
    kind: map
    initialBlock: 43005492
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:tycho.evm.uniswap.v3.fees.ProtocolFeePoolCandidates

  - name: store_protocol_fee_pools
    kind: store
    initialBlock: 43005492
    updatePolicy: set_if_not_exists
    valueType: bytes
    inputs:
      - map: map_protocol_fee_pool_candidates

  - name: map_protocol_fee_changes
    kind: map
    initialBlock: 43005492
    inputs:
      - source: sf.ethereum.type.v2.Block
      - store: store_protocol_fee_pools
    output:
      type: proto:tycho.evm.v1.BlockChanges
