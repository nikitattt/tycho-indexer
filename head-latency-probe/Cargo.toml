[package]
name = "head-latency-probe"
version.workspace = true
edition = "2021"
description = "Minimal head-latency probe for Substreams vs RPC websocket newHeads"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
license.workspace = true
categories.workspace = true

[[bin]]
name = "head-latency-probe"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
futures-util = "0.3"
http = "0.2"
prost = "0.11"
prost-types = "0.11"
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
tokio-tungstenite = { version = "0.20.1", default-features = false, features = [
    "connect",
    "rustls-tls-native-roots",
] }
tonic = { version = "0.9", features = ["tls-roots", "gzip"] }
